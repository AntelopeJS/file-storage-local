name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1-campaign
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false

  checks:
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm test
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
