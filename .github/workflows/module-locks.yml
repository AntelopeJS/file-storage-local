name: module locks

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/module-locks.yml

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: read
    uses: AntelopeJS/.github/.github/workflows/module-locks-refresh.yml@8c79f96b4f7f374ebb9346cfd0b8a182ee92fb9b # v2
    with:
      projects: ""
      commands: |
        rm -rf antelope-lock
        pnpm test
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
